<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INNOVARENA — BUILD. COMPETE. INNOVATE.</title>
  <meta name="description" content="Where creators from around the world compete through ideas. Enter the arena." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron','sans-serif'],
            inter: ['Inter','sans-serif'],
            mono: ['JetBrains Mono','monospace'],
          },
          colors: {
            neon: { cyan:'#00f5ff', purple:'#a855f7', pink:'#ec4899', green:'#00ff88', yellow:'#ffd700', orange:'#ff6b35' },
            dark: { 900:'#020408', 800:'#060c14', 700:'#0a1628', 600:'#0f1f3d', 500:'#162545' },
          },
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <canvas id="particles-canvas"></canvas>
  <div id="notifications-container"></div>
  <script src="app.js"></script>
</body>
</html>
